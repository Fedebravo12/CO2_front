# Sirve la SPA. TLS, /api y /ws los resuelve el nginx del backend, que esta
# delante de este contenedor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta es del router de React (/registro/ENS-..., /programas):
    # si no es un archivo, se devuelve index.html y el cliente resuelve. Sin esto
    # recargar la pagina en una ruta interna da 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
